name: Media and dependency security
on: [pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade 'setuptools>=84.1.0'
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip check
      - run: python -m pip_audit
      - run: python -m compileall -q .
      - run: python -m unittest -v test_runtime_reliability
