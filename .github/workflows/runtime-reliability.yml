name: Runtime reliability checks
on:
  pull_request:
  push:
    branches: [fix/runtime-reliability-20261126]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest -v test_runtime_reliability
